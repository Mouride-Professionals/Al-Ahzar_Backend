name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - "*.md"

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Authenticate to DO registry
        run: doctl registry login --expiry-seconds 600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            registry.digitalocean.com/africadex-registry/al-azhar-backend:${{ github.sha }}
            registry.digitalocean.com/africadex-registry/al-azhar-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 144.126.204.214
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            cd /opt/al-azhar
            git fetch origin main
            git reset --hard origin/main
            doctl registry login --expiry-seconds 600
            IMAGE_TAG=$GITHUB_SHA docker compose pull strapi
            IMAGE_TAG=$GITHUB_SHA docker compose up -d
            docker image prune -f
